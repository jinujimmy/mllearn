feature_engineering:
  renaming_columns:
    "season": "season"
    "holiday": "is_holiday"
    "weekday": "is_weekday"
    "workingday": "is_workingday"
    "weathersit": "weather"
    "temp": "temperature"
    "atemp": "apparent_temperature"
    "hum": "humidity"
    "windspeed": "windspeed"
    "casual": "casual_users"
    "registered": "registered_users"
    "cnt": "total_users"

model:
  cutoff: "2012-10-01"
  target: total_users
  random_state: 42
  leakage_or_id:
    - instant
    - casual_users
    - registered_users
  drop_from_features:
    - datetime
    - dteday
